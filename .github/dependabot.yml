version: 2

updates:
  # Application dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # Major bumps are breaking by definition (tailwind 3 -> 4 rewrites the
    # config format; lucide 1.x dropped brand icons). Review and run those
    # deliberately rather than having them opened automatically.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Batch routine bumps into one PR each to keep the noise down.
      # Security fixes are raised separately and immediately regardless.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The deploy workflow's own actions (actions/checkout, deploy-pages, ...).
  # These are pinned to major tags, so this catches security fixes in the
  # pipeline itself — the part that holds pages:write.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
