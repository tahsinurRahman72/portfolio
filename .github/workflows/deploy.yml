name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs and editor config don't affect the built site, so skip the run.
    # Site content lives in data/resume.ts, not in markdown.
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
      - .vscode/**
      - .claude/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time. Queued runs are skipped in favour of the
# latest, but an in-progress deployment is never cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Add .nojekyll
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
